[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tracer"
version = "0.2.1"
description = "Universal tracing library for AI agent systems with LLM integration, context management, and export capabilities"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Agent Tracer Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
]

[tool.setuptools]
packages = [
    "agent_tracer",
    "agent_tracer.core",
    "agent_tracer.storage",
    "agent_tracer.models",
    "agent_tracer.decorators",
    "agent_tracer.context",
    "agent_tracer.utils",
    "agent_tracer.integrations",
    "agent_tracer.integrations.exporters"
]
package-dir = {"agent_tracer" = "."}

[project.optional-dependencies]
llm = [
    "anthropic>=0.18.0",
    "openai>=1.0.0",
]
langchain = [
    "langchain-core>=0.1.0",
]
exporters = [
    "requests>=2.31.0",
]
all = [
    "anthropic>=0.18.0",
    "openai>=1.0.0",
    "langchain-core>=0.1.0",
    "requests>=2.31.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "rich>=13.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["agent_tracer"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
